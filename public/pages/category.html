<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fintack - Manage Categories</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="premium-navbar">
      <a href="dashboard.html" class="nav-brand">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Fintack
      </a>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transaction.html" class="nav-link">Transactions</a>
        <a href="category.html" class="nav-link active">Categories</a>
        <a href="change-password.html" class="nav-link">Settings</a>
        <a
          href="#"
          onclick="
            logout();
            return false;
          "
          class="nav-link text-danger"
          >Logout</a
        >
      </div>
    </nav>

    <main class="dashboard-content">
      <div class="flex-between mb-4">
        <div>
          <h1 style="font-size: 2.25rem">Categories</h1>
          <p class="text-secondary">
            Group your transactions for better budget insights
          </p>
        </div>
        <button onclick="openAddModal()" class="btn-premium">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Category
        </button>
      </div>

      <!-- Category list card -->
      <div class="glass-card">
        <div class="table-responsive">
          <table class="premium-table">
            <thead>
              <tr>
                <th>Category Name</th>
                <th>Unique ID</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoryList">
              <tr>
                <td colspan="3" class="text-center text-muted py-4">
                  Loading categories...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Overlay for Add/Edit Category -->
    <div id="categoryModal" class="modal-overlay">
      <div class="modal-premium">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Category</h5>
          <button onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form
            onsubmit="
              event.preventDefault();
              saveCategory();
            "
          >
            <div class="form-group">
              <label for="categoryNameInput" class="form-label"
                >Category Name</label
              >
              <input
                type="text"
                id="categoryNameInput"
                class="form-input"
                placeholder="e.g. Food, Transport, Rent"
                required
              />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            onclick="closeModal()"
            class="btn-premium btn-premium-secondary"
          >
            Cancel
          </button>
          <button onclick="saveCategory()" class="btn-premium">
            Save Category
          </button>
        </div>
      </div>
    </div>

    <script src="../js/category.js"></script>
  </body>
</html>
