<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fintack - Change Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="premium-navbar">
      <a href="dashboard.html" class="nav-brand">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Fintack
      </a>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transaction.html" class="nav-link">Transactions</a>
        <a href="category.html" class="nav-link">Categories</a>
        <a
          href="#"
          onclick="
            logout();
            return false;
          "
          class="nav-link text-danger"
          >Logout</a
        >
      </div>
    </nav>

    <div class="dashboard-content" style="max-width: 500px; margin-top: 4rem">
      <div class="glass-card">
        <h3 class="mb-4">Change Password</h3>

        <form
          onsubmit="
            event.preventDefault();
            changePassword();
          "
        >
          <div class="form-group">
            <label for="oldPassword" class="form-label">Old Password</label>
            <input
              type="password"
              id="oldPassword"
              class="form-input"
              placeholder="Current password"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="form-group">
            <label for="newPassword" class="form-label">New Password</label>
            <input
              type="password"
              id="newPassword"
              class="form-input"
              placeholder="New password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label"
              >Confirm New Password</label
            >
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="Confirm new password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn-premium flex-grow-1">
              Update Password
            </button>
            <a href="dashboard.html" class="btn-premium btn-premium-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/change-password.js"></script>
  </body>
</html>
