<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Management - Reset Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="glass-card auth-card">
        <div class="text-center mb-4">
          <h2
            class="nav-brand justify-content-center mb-2"
            style="font-size: 2rem"
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="me-2"
              style="color: #6366f1"
            >
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path
                d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              ></path>
            </svg>
            Fintack
          </h2>
          <p class="text-muted">Recover password by choosing a new one</p>
        </div>

        <form
          onsubmit="
            event.preventDefault();
            resetPassword();
          "
        >
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Your username"
              required
            />
          </div>

          <div class="form-group">
            <label for="newPassword" class="form-label">New Password</label>
            <input
              type="password"
              id="newPassword"
              class="form-input"
              placeholder="Enter new password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label"
              >Confirm New Password</label
            >
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="Confirm new password"
              required
            />
          </div>

          <button type="submit" class="btn-premium w-100 mt-4">
            Reset Password
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted text-xs">Remembered your password? </span>
          <a href="/pages/login.html" class="font-semibold text-xs">Back to Login</a>
        </div>
      </div>
    </div>

    <script src="../js/forgot-password.js"></script>
  </body>
</html>
