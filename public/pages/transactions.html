<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1>Transactions</h1>

    <a href="create-transaction.html" class="btn btn-primary mt-3">
        Create Transaction
    </a>

    <table class="table mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through transactions and display them in the table -->
            <tr>
                <td>1</td>
                <td>Category 1</td>
                <td>$100.00</td>
                <td>2022-01-01</td>
                <td>
                    <a href="edit-transaction.html?id=1" class="btn btn-primary">Edit</a>
                    <a href="delete-transaction.html?id=1" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            <!-- Repeat for each transaction -->
        </tbody>
    </table>

</div>

</body>
</html>
