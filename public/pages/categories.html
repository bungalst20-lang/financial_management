<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
        .table thead th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; border-bottom: 1px solid #dee2e6; }
        .table tbody tr:last-child td { border-bottom: none; }
        .badge-id { background-color: #e9ecef; color: #495057; font-weight: 500; border-radius: 6px; padding: 3px 8px; font-size: .75rem; }
        .btn-icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }
        #emptyState { display: none; }
    </style>
</head>
<body>

<div class="container" style="max-width: 720px; padding-top: 48px; padding-bottom: 48px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-semibold mb-0">Categories</h4>
            <p class="text-muted small mb-0">Manage your transaction categories</p>
        </div>
        <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="openCreateModal()">
            <i class="bi bi-plus-lg me-1"></i> New Category
        </button>
    </div>

    <!-- Alert -->
    <div id="alert" class="alert alert-dismissible fade" role="alert" style="display:none!important;">
        <span id="alertMsg"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Card -->
    <div class="card">
        <div class="card-body p-0">

            <!-- Search -->
            <div class="p-3 border-bottom">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input id="searchInput" type="text" class="form-control border-start-0 ps-0" placeholder="Search categories…" oninput="filterTable()" />
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4" style="width:60px;">ID</th>
                            <th>Name</th>
                            <th class="text-end pe-4" style="width:100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody"></tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="text-center py-5 text-muted">
                <i class="bi bi-tag fs-2 d-block mb-2"></i>
                <p class="mb-0 small">No categories found</p>
            </div>

        </div>
    </div>

</div>

<!-- Modal: Create / Edit -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 rounded-3 shadow">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-semibold" id="categoryModalLabel">New Category</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2">
                <input type="hidden" id="editId" />
                <label class="form-label small text-muted">Category Name</label>
                <input id="categoryName" type="text" class="form-control" placeholder="e.g. Food & Drinks" />
                <div id="nameError" class="text-danger small mt-1" style="display:none;">Name is required.</div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm px-3" onclick="saveCategory()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Delete Confirm -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
        <div class="modal-content border-0 rounded-3 shadow">
            <div class="modal-body text-center py-4">
                <div class="mb-3"><i class="bi bi-trash3 fs-1 text-danger"></i></div>
                <h6 class="fw-semibold">Delete Category?</h6>
                <p class="text-muted small mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0 pb-4 gap-2">
                <button type="button" class="btn btn-light btn-sm px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm px-4" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/category.js"></script>
</body>
</html>
