<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Management - Login</title>
    <!-- Include Bootstrap Grid + CSS Reset only, our styling is in style.css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="glass-card auth-card">
        <div class="text-center mb-4">
          <h2
            class="nav-brand justify-content-center mb-2"
            style="font-size: 2rem"
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="me-2"
              style="color: #6366f1"
            >
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path
                d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              ></path>
            </svg>
            Fintack
          </h2>
          <p class="text-muted">Manage your wealth with beautiful precision</p>
        </div>

        <form
          onsubmit="
            event.preventDefault();
            login();
          "
        >
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Enter your username"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label mb-0">Password</label>
              <a
                href="/pages/forgot-password.html"
                class="text-xs text-muted"
                style="font-size: 0.8rem; hover: text-white"
                >Forgot password?</a
              >
            </div>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="btn-premium w-100 mt-4">Sign In</button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted text-xs">Don't have an account? </span>
          <a href="/pages/register.html" class="font-semibold text-xs"
            >Create one free</a
          >
        </div>
      </div>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
